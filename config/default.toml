# ─────────────────────────────────────────────────────────────
#  Artificial World — world settings
#
#  These are the "laws of physics" for a world. A world is fully
#  defined by:  seed + simulation version + these settings.
#  Change a setting → you get a different universe.
#
#  Settings are locked into a world when it is created, so editing
#  this file never changes a world that already exists. It only
#  affects NEW worlds.
# ─────────────────────────────────────────────────────────────

[world]
seed = 12345
width = 256              # cells east–west   (each cell ≈ 4 km)
height = 256             # cells north–south
sea_level = 0.55         # fraction of terrain height that is under water (higher = more ocean)
continent_scale = 3.0    # bigger number = more, smaller landmasses
mountain_height_m = 4500 # elevation of the tallest peaks, in metres
days_per_year = 360

[climate]
equator_temp_c = 28.0        # yearly average temperature at the equator, sea level
pole_temp_c = -22.0          # yearly average temperature at the poles
lapse_rate_c_per_km = 6.5    # how much colder it gets per km of altitude
seasonal_swing_c = 14.0      # summer/winter difference far from the equator
base_rain_mm = 1100.0         # typical yearly rainfall
climate_variability = 0.15   # how much wet/dry years swing (0 = every year identical)
climate_memory = 0.6         # 0 = each year independent, near 1 = long droughts/wet spells

[ecology]
plant_growth_rate = 0.03     # how fast vegetation regrows per day in good conditions
plant_dieback_rate = 0.01    # how fast vegetation dies in frost or drought
grazer_growth = 0.015        # how efficiently grazing animals turn plants into offspring
grazer_death = 0.004         # daily death rate of grazers
grazer_appetite = 0.012      # how much vegetation grazers eat per day
grazer_spread = 0.10         # how fast grazers wander into neighbouring land
grazer_crowding = 0.15       # density at which crowding doubles grazer deaths (disease, competition)
predator_growth = 0.015      # how efficiently predators turn prey into offspring
predator_death = 0.003       # daily death rate of predators
predator_appetite = 0.03     # how much prey predators catch per day
predator_spread = 0.06       # how fast predators wander

[people]
# The first humans. Worlds created without this section have no people.
start_population = 60        # founders, all starting in one mild, green, well-watered place
adult_harvest = 2.2          # most food (in "days of eating") an adult can gather/hunt in a day
plant_food = 10.0            # food a fully green cell offers per day
plant_cost = 0.0025          # how much vegetation one day's food uses up
hunt_food = 3.0              # food the herds in a cell offer per day
hunt_cost = 0.0008           # how many grazing animals one day's food uses up
conception_rate = 0.006      # daily chance of conceiving for a healthy couple
mutation = 0.02              # how much a child's traits drift from its parents'
predator_danger = 0.15       # how deadly predators are to people
scouting_radius = 10         # how far (cells, ~4 km each) people know the land around camp
travel_cells_per_day = 3     # how far a household walks in a day when moving camp
move_when_food_below = 1.5   # move camp when local food per person drops below this

[knowledge]
# Discovering, practising and teaching techniques. Worlds created without this
# section have no learning. What CAN be made is fixed by the world's materials
# (see aworld/knowledge.py); whether anyone ever figures it out is up to them.
experiment_rate = 0.0003     # daily chance an adult tinkers with what's around them (scaled by curiosity)
learn_rate = 0.01            # daily chance someone picks up a technique from a person nearby

[language]
# Inventing and sharing words. Worlds created without this section have no
# language. No words are built in: every word is coined by someone in the world.
talk_rate = 0.5              # chance, each round, that someone talks with a person nearby (scaled by the speech trait)
rounds_per_day = 3           # rounds of conversation per day
invent_rate = 0.01           # chance a speaker coins a word for something they have no word for
sound_change = 0.01          # chance a sound slips when a word is copied (dialects form from these)
innovate_rate = 0.00003      # chance a speaker coins a new way of saying something they already have a word for
switch_rate = 0.25           # chance a listener takes up a speaker's word when theirs differs (children: double)
conformity = 2.0             # how strongly people go with the majority (1 = not at all; real people: about 2–3)
conformity_sample = 4        # how many others nearby a listener compares a word with
accent_rate = 0.05           # chance a listener picks up the speaker's accent (children: five times as likely)
accent_innovate = 0.000005     # chance a speaker starts pronouncing a sound a new way (a new sound rule)

[minds]
# Memories, feelings and goals. Worlds created without this section have
# people who live only in the present. (See aworld/minds.py for how they work.)
grief_slows_work = 0.2       # how much a grieving person's foraging suffers (0 = not at all)
fear_moves_above = 0.65      # a household this frightened moves away from predators, even from good land (1 = never)
fear_avoids_predators = 1.0  # how much frightened people steer clear of predator country
loneliness_pull = 1.5        # how much harder lonely people are drawn toward others
place_memory = 0.8           # how much remembered good/bad places sway where people camp

[storage]
checkpoint_every_days = 360  # save a full snapshot this often (360 = once per year)
max_storage_gb = 100         # hard cap; old snapshots are thinned to stay under it
metrics_every_days = 10      # record world statistics this often
