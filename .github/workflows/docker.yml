# Builds the Artificial World Docker image and publishes it to GitHub's
# container registry (ghcr.io) every time code is pushed to main.
#
#   ghcr.io/chewyvkb/artificial-world:latest     newest build from main
#   ghcr.io/chewyvkb/artificial-world:sha-abc1234 a specific commit
#   ghcr.io/chewyvkb/artificial-world:v1.2.3     when a v* tag is pushed
#
# The tests must pass before anything is published.
name: Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:          # lets you run it by hand from the Actions tab

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests -t . -v

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3      # lets us also build for ARM machines
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Work out the image tags locally (no GitHub API calls, so a GitHub API
      # hiccup can't break the build).
      - name: Image names and tags
        id: meta
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"            # registry names must be lowercase
          tags="${image}:sha-${GITHUB_SHA::7}"
          if [[ "$GITHUB_REF" == "refs/heads/${{ github.event.repository.default_branch }}" ]]; then
            tags="${tags},${image}:latest"
          fi
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tags="${tags},${image}:${GITHUB_REF_NAME#v}"
          fi
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            tags="${image}:pr-${{ github.event.number }}"
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
          {
            echo "labels<<EOF"
            echo "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}"
            echo "org.opencontainers.image.revision=${GITHUB_SHA}"
            echo "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Tags: ${tags}"

      - name: Build (and publish, except for pull requests)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
